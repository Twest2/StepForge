name: Publish Launchpad PPA

# A published GitHub Release is the release signal.  The existing manual
# Release workflow creates one, and releases published directly in GitHub are
# covered too.  Drafts and prereleases deliberately stay out of the stable PPA.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published GitHub Release tag to upload, e.g. v0.4.1.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launchpad-ppa-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload PPA source package
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.version }}
      # Override these repository variables if the PPA is renamed or the
      # supported Ubuntu series changes.
      LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA || 'ppa:twest39/stepforge' }}
      LAUNCHPAD_SERIES: ${{ vars.LAUNCHPAD_SERIES || 'resolute' }}
      LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
      LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
      LAUNCHPAD_GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Install source-package tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential debhelper devscripts dput gnupg

      - name: Import the Launchpad signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LAUNCHPAD_GPG_PRIVATE_KEY" || { echo 'Missing LAUNCHPAD_GPG_PRIVATE_KEY secret.' >&2; exit 1; }
          test -n "$LAUNCHPAD_GPG_KEY_ID" || { echo 'Missing LAUNCHPAD_GPG_KEY_ID secret.' >&2; exit 1; }
          test -n "$LAUNCHPAD_GPG_PASSPHRASE" || { echo 'Missing LAUNCHPAD_GPG_PASSPHRASE secret.' >&2; exit 1; }
          install -d -m 700 "$HOME/.gnupg"
          printf '%s' "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          # debsign invokes GPG with a sanitised environment, so it cannot
          # inherit the secret directly. Keep it in a mode-600, job-temporary
          # file and have the signing wrapper read it non-interactively.
          PASSPHRASE_FILE="$RUNNER_TEMP/launchpad-gpg-passphrase"
          (umask 077; printf '%s' "$LAUNCHPAD_GPG_PASSPHRASE" > "$PASSPHRASE_FILE")
          cat > "$RUNNER_TEMP/gpg-debsign" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PASSPHRASE_FILE" "\$@"
          EOF
          chmod 0700 "$RUNNER_TEMP/gpg-debsign"
          echo "DEBSIGN_PROGRAM=$RUNNER_TEMP/gpg-debsign" >> "$GITHUB_ENV"

      - name: Build signed source package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stamp-version.js "${TAG#v}"
          VERSION="$(node -e "process.stdout.write(require('./package.json').buildVersion)")"
          STEPFORGE_DEBSIGN_PROGRAM="$DEBSIGN_PROGRAM" bash scripts/launchpad/build-source-package.sh \
            --version "$VERSION" \
            --series "$LAUNCHPAD_SERIES" \
            --key "$LAUNCHPAD_GPG_KEY_ID" \
            --out build/launchpad

      - name: Upload source package to Launchpad
        shell: bash
        run: dput "$LAUNCHPAD_PPA" build/launchpad/*_source.changes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchpad-source-${{ github.event.release.tag_name || inputs.version }}
          path: build/launchpad/
          if-no-files-found: ignore
