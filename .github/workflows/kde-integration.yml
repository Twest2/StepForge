name: KDE Plasma integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kde-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the exact PR commit; install it on Plasma without GNOME.
  plasma:
    name: Plasma 6 (${{ matrix.os }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Kubuntu 26.04
            image: ubuntu:26.04
            format: deb
          - os: Fedora 44 KDE
            image: fedora:44
            format: rpm
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates tar gzip xz-utils
          else
            dnf install -y git ca-certificates tar gzip xz
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install packaging tools
        run: |
          if [[ '${{ matrix.format }}' == deb ]]; then
            bash scripts/linux/apt/install-build-deps.sh
          else
            bash scripts/linux/dnf/install-build-deps.sh --rpm-only
          fi
      - run: npm ci
      - name: Build the package under test
        env:
          STEPFORGE_RPM_FAST: '1'
        run: npm run package:linux:${{ matrix.format }}
      - name: Install on Plasma and exercise real KWin
        run: |
          if [[ '${{ matrix.format }}' == deb ]]; then
            packages=(build/artifacts/*.deb)
          else
            packages=(build/artifacts/x86_64/*.rpm)
          fi
          [[ ${#packages[@]} == 1 && -f "${packages[0]}" ]]
          bash tests/integration/linux/kde-installed.test.sh "${packages[0]}" 2>&1 | tee kde-installed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kde-${{ matrix.format }}-integration-log
          path: kde-installed.log

  # The packaged input rule against real kernel devices: mouse access only
  # where KWin is installed, and never for a keyboard.
  input-rule:
    name: Input rule on real devices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create virtual devices and check their udev access
        run: |
          sudo modprobe uinput
          sudo modprobe evdev || true
          sudo env GITHUB_ACTIONS=true python3 tests/integration/linux/input-rule.test.py

  # The whole recording flow on a real Plasma desktop: KDE's own share and
  # shortcut dialogs, the PipeWire stream, clicks, window crops, the tray and
  # Spectacle. KWin needs a GPU device node to share the screen; the kernel's
  # virtual GEM driver provides one on the runner.
  desktop:
    name: Plasma 6 full desktop (Kubuntu 26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Load the virtual GPU device
        run: |
          if ! sudo modprobe vgem; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          fi
          ls -l /dev/dri
      - run: npm ci
      - name: Build the package under test
        run: npm run package:linux:deb
      - name: Record on the Plasma desktop
        run: |
          context="$(mktemp -d)"
          cp -r tests/integration/linux/kde-desktop "$context/fixture"
          cp "$context/fixture/Dockerfile" "$context/Dockerfile"
          packages=(build/artifacts/*.deb)
          [[ ${#packages[@]} == 1 && -f "${packages[0]}" ]]
          cp "${packages[0]}" "$context/stepforge.deb"
          docker build -t stepforge-kde-desktop-test "$context"
          mkdir -p "$RUNNER_TEMP/kde-desktop"
          docker run --rm --privileged --shm-size=1g \
            -v "$RUNNER_TEMP/kde-desktop:/artifacts" stepforge-kde-desktop-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kde-full-desktop-results
          path: ${{ runner.temp }}/kde-desktop/
          if-no-files-found: ignore
