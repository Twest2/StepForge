name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Supported desktop targets are Windows and Linux. macOS is not a
      # support target; do not imply it by testing on it.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The capture unit tests require app/capture.js, which require()s the
      # electron module at load — so the Electron binary must actually be
      # installed (don't set ELECTRON_SKIP_BINARY_DOWNLOAD here).
      - name: Install dependencies
        run: npm ci

      - name: Verify Chocolatey packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'chocolatey-smoke'
          Copy-Item packaging/windows/chocolatey $packageRoot -Recurse
          # A fixture verifies packing and payload inclusion without installing anything.
          $installerName = 'StepForge Setup 0.0.0.1.exe'
          Set-Content (Join-Path $packageRoot "tools/$installerName") 'packaging smoke test'
          choco pack "$packageRoot/stepforge.nuspec" --version 0.0.0.1 --outputdirectory $packageRoot
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$packageRoot/stepforge.0.0.0.1.nupkg")
          try {
            foreach ($name in @("tools/$installerName", 'tools/chocolateyinstall.ps1', 'tools/chocolateyuninstall.ps1')) {
              if (-not $archive.GetEntry($name)) { throw "Package is missing $name" }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Run unit tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Production dependencies must be clean: these ship inside packages.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --package-lock-only --audit-level=high

      # Electron is declared as a development dependency but is explicitly
      # bundled into every release package. Build tooling also processes
      # untrusted project inputs, so no high/critical advisory is allowed in
      # the locked tree.
      - name: Audit full dependency tree (blocking)
        run: npm audit --package-lock-only --audit-level=high

  ubuntu-package:
    name: Ubuntu test package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Ubuntu GNOME package
        run: npm run package:linux:deb
      - name: Verify package payload
        run: |
          dpkg-deb --contents build/artifacts/*.deb > /tmp/stepforge-payload.txt
          grep 'gnome-shell/extensions/stepforge@twestbrook.com/extension.js' /tmp/stepforge-payload.txt
          grep 'app/platform/linux/portal_capture.py' /tmp/stepforge-payload.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-gnome-test-package
          path: |
            build/artifacts/*.deb
            build/artifacts/*.sha256
            build/artifacts/*.tar.gz
          if-no-files-found: error

  fedora-package:
    name: Fedora 44 GNOME RPM (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: dnf install -y git findutils tar gzip xz
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/linux/dnf/install-build-deps.sh
      - run: npm ci
      - name: Build Fedora package
        run: npm run package:linux:rpm
      - name: Run repository checks and RPM integration tests
        run: |
          packages=(build/artifacts/x86_64/*.rpm)
          [[ ${#packages[@]} == 1 && -f "${packages[0]}" ]] || {
            echo 'Expected exactly one Fedora RPM' >&2
            exit 1
          }
          STEPFORGE_TEST_RPM="${packages[0]}" bash tests/run_test.sh
      - name: Install and smoke-test the actual RPM
        run: bash tests/integration/linux/fedora-installed.test.sh build/artifacts/x86_64/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-44-gnome-test-package
          path: |
            build/artifacts/x86_64/*.rpm
            build/artifacts/x86_64/*.sha256
          if-no-files-found: error
