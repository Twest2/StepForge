name: Sort download badges

# The README's download badges show live counts, but their order is static.
# Once a day, refresh the Microsoft Store count, then reorder the badges from
# most to fewest downloads and commit the README only when the order actually
# changed.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sort-download-badges
  cancel-in-progress: false

jobs:
  microsoft-store:
    name: Update the Microsoft Store download count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Partner Center has no public count, so it's read with the release's
      # Entra app and served to shields.io from the badges branch.
      - name: Read the count from Partner Center
        env:
          MICROSOFT_STORE_TENANT_ID: ${{ vars.MICROSOFT_STORE_TENANT_ID }}
          MICROSOFT_STORE_CLIENT_ID: ${{ vars.MICROSOFT_STORE_CLIENT_ID }}
          MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
        run: node scripts/microsoft-store-downloads.js "$RUNNER_TEMP/badges/microsoft-store-downloads.json"

      # The branch is always one commit holding only the badge files, rebuilt
      # and force-pushed, so it never grows and a deleted branch comes back on
      # the next run.
      - name: Publish it on the badges branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          file=microsoft-store-downloads.json
          if git fetch --quiet --depth=1 origin refs/heads/badges 2>/dev/null &&
             git show "FETCH_HEAD:$file" 2>/dev/null | cmp -s - "$RUNNER_TEMP/badges/$file"; then
            echo 'The badges branch already has this count.'
            exit 0
          fi
          printf '%s\n' \
            '# Badges' \
            '' \
            'Generated by .github/workflows/sort-download-badges.yml for the' \
            'Microsoft Store downloads badge in the README. Every run replaces this branch' \
            'with a single commit, so it is safe to delete: the next run creates it again.' \
            > "$RUNNER_TEMP/badges/README.md"
          tree=$(printf '100644 blob %s\t%s\n' \
            "$(git hash-object -w "$RUNNER_TEMP/badges/README.md")" README.md \
            "$(git hash-object -w "$RUNNER_TEMP/badges/$file")" "$file" | git mktree)
          commit=$(git commit-tree "$tree" -m 'Update the Microsoft Store download count')
          git push --force origin "$commit:refs/heads/badges"

  sort:
    name: Sort README download badges
    needs: microsoft-store
    # When Partner Center can't be read, sort with the count already on the
    # badges branch; the failed job above still marks the run as failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Reorder badges by download count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sort-download-badges.js README.md

      - name: Commit the new order
        run: |
          if git diff --quiet -- README.md; then
            echo 'Badge order unchanged; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sort README download badges by count' -- README.md
          git push origin HEAD:main
