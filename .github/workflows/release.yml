name: Release

# Manual release: from the GitHub "Actions" tab pick "Release", click
# "Run workflow", enter the version tag, and it builds the Windows installer
# .exe and Ubuntu .deb, then publishes a GitHub Release with both attached and
# auto-generated notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.4 or v0.4.0.1 (short numeric versions are normalized to x.y.0 for packages)'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

# Needed for the release job to create the tag and the GitHub Release.
permissions:
  contents: write
  
jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stamp the requested version onto package.json so the produced artifact
      # carries it. Not committed back — it only affects this build.
      - name: Set version from input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.js "${VERSION#v}"

      - name: Configure Windows code signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            {
              printf 'WIN_CSC_LINK=%s\n' "$WIN_CSC_LINK"
              printf 'WIN_CSC_KEY_PASSWORD=%s\n' "$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "Windows code signing secrets not configured; building unsigned."
          fi

      - name: Package Windows installer .exe
        run: npm run package:windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: releases/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Ubuntu GNOME package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Set version from input
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.js "${VERSION#v}"
      - name: Build Ubuntu package and checksums
        run: npm run package:linux:deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu
          path: |
            build/artifacts/*.deb
            build/artifacts/*.sha256
            build/artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded artifacts
        run: find dist -type f -printf '%s\t%p\n'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/windows-installer/*.exe \
            dist/linux-ubuntu/*.deb \
            dist/linux-ubuntu/*.tar.gz \
            dist/linux-ubuntu/*.sha256 \
            --title "StepForge $TAG" \
            --target "${{ github.sha }}" \
            --generate-notes \
            "${flags[@]}"

      # Releases created with GITHUB_TOKEN do not emit a release event that
      # starts another workflow. Dispatch the PPA workflow explicitly so every
      # stable release created here is uploaded to Launchpad.
      - name: Publish Debian package to ProGet
        if: inputs.prerelease == false
        shell: bash
        env:
          PROGET_API_KEY: ${{ secrets.PROGET_API_KEY }}
        run: |
          set -euo pipefail
      
          DEB_FILE="$(find dist/linux-ubuntu -maxdepth 1 -name '*.deb' -type f | head -n 1)"
      
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb package found"
            exit 1
          fi
      
          echo "Uploading $DEB_FILE to ProGet..."
      
          curl --fail-with-body \
            --request PUT \
            --header "X-ApiKey: $PROGET_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$DEB_FILE" \
            "https://upload-packages-ksdbfjsadbfshjkafb.twestbrook.com/api/packages/stepforge/upload?distribution=resolute&component=main"

  # Fedora starts after Windows/Ubuntu publishing. It is in this workflow so
  # releases have one entry point, but it cannot stop the release job above.
  build-fedora:
    name: Build Fedora 44 GNOME RPM
    needs: release
    runs-on: ubuntu-24.04
    container: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - run: dnf install -y git findutils tar gzip xz
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/linux/dnf/install-build-deps.sh
      - run: npm ci
      - name: Stamp release version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.js "${VERSION#v}"
      - run: bash tests/run_test.sh
      - run: npm run package:linux:rpm
      - name: Verify installed package
        run: bash tests/integration/linux/fedora-installed.test.sh build/artifacts/x86_64/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-fedora
          path: |
            build/artifacts/x86_64/*.rpm
            build/artifacts/x86_64/*.sha256
          if-no-files-found: error

  publish-fedora:
    name: Publish Fedora RPM
    needs: [release, build-fedora]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-fedora
          path: dist/linux-fedora
      - name: Attach Fedora artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd dist/linux-fedora
          sha256sum --check ./*.sha256
          gh release upload "$TAG" ./*.rpm ./*.sha256 --clobber
      - name: Publish stable RPM to ProGet
        if: inputs.prerelease == false
        env:
          PROGET_API_KEY: ${{ secrets.PROGET_API_KEY }}
          PROGET_RPM_FEED: ${{ vars.PROGET_RPM_FEED }}
          PROGET_UPLOAD_URL: ${{ vars.PROGET_UPLOAD_URL || 'https://upload-packages-ksdbfjsadbfshjkafb.twestbrook.com' }}
        run: |
          set -euo pipefail
          : "${PROGET_API_KEY:?Set the existing PROGET_API_KEY secret with upload permission for the RPM feed}"
          : "${PROGET_RPM_FEED:?Set PROGET_RPM_FEED to a separate ProGet RPM feed, e.g. stepforge-fedora}"
          [[ "$PROGET_RPM_FEED" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Invalid RPM feed name'; exit 1; }
          [[ "$PROGET_UPLOAD_URL" == https://* ]] || { echo 'ProGet upload URL must use HTTPS'; exit 1; }
          shopt -s nullglob
          packages=(dist/linux-fedora/*.rpm)
          [[ ${#packages[@]} == 1 ]] || { echo 'Expected exactly one Fedora RPM'; exit 1; }
          rpm_file="${packages[0]}"
          curl --fail-with-body --request PUT \
            --header "X-ApiKey: $PROGET_API_KEY" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$rpm_file" \
            "${PROGET_UPLOAD_URL%/}/api/packages/$PROGET_RPM_FEED/upload/$(basename "$rpm_file")"
