name: Sort download badges

# The README's download badges show counts from the badges branch, but their
# order is static. Once a day, refresh those counts, then reorder the badges from
# most to fewest downloads and commit the README only when the order actually
# changed.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sort-download-badges
  cancel-in-progress: false

jobs:
  badge-counts:
    name: Update the badge download counts
    runs-on: ubuntu-latest
    env:
      # The public ProGet host blocks shields.io and GitHub runners. Read counts
      # from the same ProGet host that release publishing uses.
      PROGET_BADGE_BASE_URL: ${{ vars.PROGET_UPLOAD_URL || 'https://upload-packages-ksdbfjsadbfshjkafb.twestbrook.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Read the APT, DNF and Chocolatey counts from ProGet
        run: node scripts/proget-downloads.js "$RUNNER_TEMP/badges"

      # Partner Center has no public count, so it's read with the release's
      # Entra app and served to shields.io from the badges branch.
      - name: Read the count from Partner Center
        if: ${{ !cancelled() }}
        env:
          MICROSOFT_STORE_TENANT_ID: ${{ vars.MICROSOFT_STORE_TENANT_ID }}
          MICROSOFT_STORE_CLIENT_ID: ${{ vars.MICROSOFT_STORE_CLIENT_ID }}
          MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
        run: node scripts/microsoft-store-downloads.js "$RUNNER_TEMP/badges/microsoft-store-downloads.json"

      # The branch is always one commit holding only the badge files, rebuilt
      # and force-pushed, so it never grows and a deleted branch comes back on
      # the next run. A count that couldn't be read keeps its old file.
      - name: Publish them on the badges branch
        if: ${{ !cancelled() }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/badges"
          mkdir -p "$dir"
          old=
          if git fetch --quiet --depth=1 origin refs/heads/badges 2>/dev/null; then
            old=$(git rev-parse FETCH_HEAD)
            for file in $(git ls-tree --name-only "$old"); do
              [ -e "$dir/$file" ] || git show "$old:$file" > "$dir/$file"
            done
          fi
          printf '%s\n' \
            '# Badges' \
            '' \
            'Generated by .github/workflows/sort-download-badges.yml for the download' \
            'badges in the README. Every run replaces this branch with a single commit,' \
            'so it is safe to delete: the next run creates it again.' \
            > "$dir/README.md"
          tree=$(for file in "$dir"/*; do
            printf '100644 blob %s\t%s\n' "$(git hash-object -w "$file")" "$(basename "$file")"
          done | git mktree)
          if [ -n "$old" ] && [ "$tree" = "$(git rev-parse "$old^{tree}")" ]; then
            echo 'The badges branch already has these counts.'
            exit 0
          fi
          commit=$(git commit-tree "$tree" -m 'Update the download counts')
          git push --force origin "$commit:refs/heads/badges"

  sort:
    name: Sort README download badges
    needs: badge-counts
    # When Partner Center can't be read, sort with the count already on the
    # badges branch; the failed job above still marks the run as failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Reorder badges by download count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The public ProGet host can block GitHub runners. Read counts from
          # the same ProGet host that release publishing uses.
          PROGET_BADGE_BASE_URL: ${{ vars.PROGET_UPLOAD_URL || 'https://upload-packages-ksdbfjsadbfshjkafb.twestbrook.com' }}
        run: node scripts/sort-download-badges.js README.md

      - name: Commit the new order
        run: |
          if git diff --quiet -- README.md; then
            echo 'Badge order unchanged; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sort README download badges by count' -- README.md
          git push origin HEAD:main
